<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('projservicos_token')||'',currentUser=null,catalog=null;
function feedback(msg){$('feedback').textContent=msg||''}
function callServer(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||'Falha na operação.')))[fn](...args))}
function show(view){['loginView','recoveryView','dashboardView'].forEach(id=>$(id).classList.toggle('hidden',id!==view));feedback('')}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function dateTime(v){return new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}
function metric(label,value){return '<div class="metric"><span>'+label+'</span><strong>'+value+'</strong></div>'}
function fillSelect(id,items,placeholder,labelFn){const el=$(id);el.innerHTML='';const first=document.createElement('option');first.value='';first.textContent=placeholder;el.appendChild(first);items.forEach(x=>{const o=document.createElement('option');o.value=x.id||x.ID;o.textContent=labelFn(x);el.appendChild(o)})}
async function loadCatalog(){
 catalog=await callServer('obterCatalogoFormulario',token);
 if(catalog.perfil==='CLIENTE'){$('bookingClientWrap').classList.add('hidden')}else{ $('bookingClientWrap').classList.remove('hidden');fillSelect('bookingClient',catalog.clientes,'Selecione o cliente',x=>x.NOME)}
 fillSelect('bookingService',catalog.servicos,'Selecione o serviço',x=>x.nome);
 if(catalog.perfil==='ADMINISTRADOR'){$('adminTools').classList.remove('hidden');fillSelect('serviceEmployee',catalog.funcionarios,'Selecione o funcionário',x=>x.NOME);['scheduleEmployee','breakEmployee','blockEmployee'].forEach(id=>fillSelect(id,catalog.funcionarios,'Selecione o funcionário',x=>x.NOME))}
 if(catalog.perfil==='FUNCIONARIO'){$('clientTool').classList.remove('hidden');['scheduleEmployeeWrap','breakEmployeeWrap','blockEmployeeWrap'].forEach(id=>$(id).classList.add('hidden'));$('clientCreateAccess').closest('div').classList.add('hidden');$('clientLoginEmail').closest('div').classList.add('hidden');$('clientLoginPassword').closest('div').classList.add('hidden')}
 if(catalog.perfil==='FUNCIONARIO')$('bookingEmployee').innerHTML='<option value="'+catalog.funcionarioId+'">Minha agenda</option>';
 updateEmployeeOptions();
}
function updateEmployeeOptions(){const s=catalog.servicos.find(x=>x.id===$('bookingService').value);const el=$('bookingEmployee');el.innerHTML='';if(catalog.perfil==='FUNCIONARIO'){el.innerHTML='<option value="'+catalog.funcionarioId+'">Minha agenda</option>';return}const opts=(s?s.funcionarios:[]);if(catalog.perfil==='ADMINISTRADOR'){const any=document.createElement('option');any.value='';any.textContent='Escolher automaticamente';el.appendChild(any)}else{const any=document.createElement('option');any.value='';any.textContent='Qualquer profissional disponível';el.appendChild(any)}opts.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.nome+' — '+money(x.preco);el.appendChild(o)})}
function renderDashboard(data){
 currentUser=data.usuario;$('welcomeName').textContent='Olá, '+(currentUser.nome||'usuário');$('roleLabel').textContent=({ADMINISTRADOR:'ADMINISTRAÇÃO',FUNCIONARIO:'ÁREA DO FUNCIONÁRIO',CLIENTE:'ÁREA DO CLIENTE'})[currentUser.perfil]||'PAINEL';
 const m=$('metrics');m.innerHTML='';if(data.resumo){const r=data.resumo;m.innerHTML=metric('Agendamentos',r.agendamentos)+metric('Confirmados',r.confirmados)+metric('Clientes',r.clientes)+metric('Funcionários',r.funcionarios)+metric('Serviços ativos',r.servicos)+metric('Faturamento previsto',money(r.faturamentoPrevisto))}else{m.innerHTML=metric('Próximos atendimentos',data.agenda.length)+metric('Pendentes',data.agenda.filter(a=>a.status==='AGUARDANDO_APROVACAO').length)}
 $('agendaTitle').textContent=currentUser.perfil==='CLIENTE'?'Meus agendamentos':'Próximos agendamentos';const list=$('agendaList');list.innerHTML='';
 if(!data.agenda.length)list.innerHTML='<div class="empty">Nenhum agendamento nos próximos 31 dias.</div>';
 data.agenda.forEach(a=>{const item=document.createElement('article');item.className='appointment';const title=document.createElement('h4');title.textContent=dateTime(a.inicio)+' — '+a.servicos;item.appendChild(title);const info=document.createElement('p');info.textContent=(a.cliente?'Cliente: '+a.cliente+' • ':'')+(a.funcionarios?'Funcionário: '+a.funcionarios+' • ':'')+'Até '+dateTime(a.fim);item.appendChild(info);const st=document.createElement('span');st.className='status';st.textContent=a.status.replaceAll('_',' ');item.appendChild(st);
 if(['ADMINISTRADOR','FUNCIONARIO'].includes(currentUser.perfil)&&a.status==='AGUARDANDO_APROVACAO'){const actions=document.createElement('div');actions.className='actions';[['Confirmar','CONFIRMADO','approve'],['Recusar','RECUSADO','reject']].forEach(([label,status,cls])=>{const btn=document.createElement('button');btn.textContent=label;btn.className=cls;btn.onclick=()=>changeStatus(a.id,status);actions.appendChild(btn)});item.appendChild(actions)}list.appendChild(item)});show('dashboardView')
}
async function loadDashboard(){feedback('Carregando painel...');try{const data=await callServer('obterDadosPainel',token);renderDashboard(data);await loadCatalog();feedback('')}catch(e){feedback(e.message);if(/sessão|inválida|expirada/i.test(e.message))logout()}}
async function changeStatus(id,status){if(!confirm(status==='CONFIRMADO'?'Confirmar este agendamento?':'Recusar este agendamento?'))return;try{await callServer('atualizarStatusAgendamento',id,status,token);await loadDashboard()}catch(e){feedback(e.message)}}
function logout(){token='';currentUser=null;sessionStorage.removeItem('projservicos_token');show('loginView')}
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>$(b.dataset.open).classList.remove('hidden'));document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.add('hidden'));
$('bookingService').onchange=updateEmployeeOptions;
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();feedback('Verificando acesso...');try{const r=await callServer('entrar',$('email').value,$('senha').value);token=r.token;sessionStorage.setItem('projservicos_token',token);await loadDashboard()}catch(err){feedback(err.message)}});
$('showRecovery').onclick=()=>{show('recoveryView');$('requestForm').classList.remove('hidden');$('resetForm').classList.add('hidden')};$('backLogin').onclick=()=>show('loginView');
$('requestForm').addEventListener('submit',async e=>{e.preventDefault();try{const r=await callServer('solicitarRecuperacaoSenha',$('recoveryEmail').value);feedback(r.mensagem);$('requestForm').classList.add('hidden');$('resetForm').classList.remove('hidden')}catch(err){feedback(err.message)}});
$('resetForm').addEventListener('submit',async e=>{e.preventDefault();try{const r=await callServer('redefinirSenhaComCodigo',$('recoveryEmail').value,$('code').value,$('newPassword').value);feedback(r.mensagem);$('resetForm').classList.add('hidden')}catch(err){feedback(err.message)}});
$('saveClientForm').addEventListener('submit',async e=>{e.preventDefault();try{const r=await callServer('salvarCliente',{NOME:$('clientName').value,TELEFONE:$('clientPhone').value,EMAIL:$('clientEmail').value,CRIAR_ACESSO:$('clientCreateAccess').checked,USUARIO_EMAIL:$('clientLoginEmail').value,SENHA_INICIAL:$('clientLoginPassword').value},token);feedback(r.existente?'Telefone já cadastrado; cliente existente selecionado.':'Cliente cadastrado.');$('clientForm').classList.add('hidden');await loadCatalog();if(r.id)$('bookingClient').value=r.id;e.target.reset()}catch(err){feedback(err.message)}});
$('saveEmployeeForm').addEventListener('submit',async e=>{e.preventDefault();try{await callServer('salvarFuncionario',{NOME:$('employeeName').value,TELEFONE:$('employeePhone').value,EMAIL:$('employeeCreateAccess').checked?$('employeeLoginEmail').value:$('employeeEmail').value,ESPECIALIDADES:$('employeeSkills').value,CRIAR_ACESSO:$('employeeCreateAccess').checked, SENHA_INICIAL:$('employeeLoginPassword').value},token);feedback('Funcionário cadastrado.');$('employeeForm').classList.add('hidden');e.target.reset();await loadCatalog()}catch(err){feedback(err.message)}});
$('saveServiceForm').addEventListener('submit',async e=>{e.preventDefault();try{await callServer('salvarServicoComFuncionario',{NOME:$('serviceName').value,DESCRICAO:$('serviceDescription').value,FUNCIONARIO_ID:$('serviceEmployee').value,PRECO:$('servicePrice').value},token);feedback('Serviço cadastrado e vinculado ao funcionário.');$('serviceForm').classList.add('hidden');e.target.reset();await loadCatalog()}catch(err){feedback(err.message)}});
$('bookingForm').addEventListener('submit',async e=>{e.preventDefault();const d={CLIENTE_ID:currentUser.perfil==='CLIENTE'?currentUser.referenciaId:$('bookingClient').value,SERVICO_ID:$('bookingService').value,FUNCIONARIO_ID:$('bookingEmployee').value,INICIO:$('bookingDate').value,DURACAO_MINUTOS:$('bookingDuration').value,OBSERVACOES:$('bookingNotes').value};try{if(!d.CLIENTE_ID)throw Error('Selecione um cliente.');const r=await callServer('criarAgendamento',d,token);feedback('Solicitação criada! Status: aguardando aprovação.');e.target.reset();$('bookingDuration').value=60;updateEmployeeOptions();await loadDashboard()}catch(err){feedback(err.message)}});
$('saveScheduleForm').addEventListener('submit',async e=>{e.preventDefault();try{await callServer('salvarHorarioFuncionario',{FUNCIONARIO_ID:$('scheduleEmployee').value,DIA_SEMANA:$('scheduleDay').value,HORA_INICIO:$('scheduleStart').value,HORA_FIM:$('scheduleEnd').value},token);feedback('Expediente salvo.');e.target.reset()}catch(err){feedback(err.message)}});
$('saveBreakForm').addEventListener('submit',async e=>{e.preventDefault();try{await callServer('salvarIntervaloFuncionario',{FUNCIONARIO_ID:$('breakEmployee').value,DIA_SEMANA:$('breakDay').value,HORA_INICIO:$('breakStart').value,HORA_FIM:$('breakEnd').value,DESCRICAO:$('breakDescription').value},token);feedback('Intervalo salvo.');e.target.reset()}catch(err){feedback(err.message)}});
$('saveBlockForm').addEventListener('submit',async e=>{e.preventDefault();try{await callServer('salvarBloqueioFuncionario',{FUNCIONARIO_ID:$('blockEmployee').value,INICIO:$('blockStart').value,FIM:$('blockEnd').value,MOTIVO:$('blockReason').value},token);feedback('Bloqueio salvo.');e.target.reset()}catch(err){feedback(err.message)}});
$('logout').onclick=logout;$('refresh').onclick=loadDashboard;(async()=>{if(token)await loadDashboard();else show('loginView')})();
</script>
